name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      aot:
        description: "Also run the Native AOT conformance check (slow)"
        type: boolean
        default: false

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # the conformance oracle must really run in CI, not be skipped
      TYPHON_REQUIRE_CPYTHON: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Install numpy (oracle for the numpy_* cases)
        run: python -m pip install numpy

      - name: Point the tests at CPython
        shell: bash
        run: echo "TYPHON_CPYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Point the Windows tests at liblzma
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $library = Get-Command git -CommandType Application | ForEach-Object {
            $gitRoot = Split-Path -Parent (Split-Path -Parent $_.Source)
            Join-Path $gitRoot 'mingw64\bin\liblzma-5.dll'
          } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $library) {
            throw "Git for Windows does not supply liblzma"
          }
          "TYPHON_LIBLZMA=$library" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build Typhon.slnx -c Release

      - name: Conformance tests
        run: dotnet test tests/Typhon.Conformance.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Playground tests (its compile-and-run code on .NET; the Blazor app is built above)
        run: dotnet test tests/Typhon.Playground.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: NumPy kernel tests (matmul and linalg against reference results, 1 and 4 threads)
        run: dotnet test tests/Typhon.NumPy.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Native AOT conformance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.aot }}
        env:
          TYPHON_CONFORMANCE_AOT: "1"
        run: dotnet test tests/Typhon.Conformance.Tests -c Release --no-build --filter "FullyQualifiedName~NativeAot" --logger "console;verbosity=detailed"
