<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Write Typhon (typed Python) and run it in your browser: the Typhon compiler, Roslyn and .NET run in WebAssembly." />
    <title>Typhon Playground</title>
    <!-- relative: the published folder works at any path (a GitHub Pages project site, a subfolder) -->
    <base href="./" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading">
            <img src="favicon.svg" alt="" width="64" height="64" />
            <div>Loading the Typhon playground: the .NET runtime, the Typhon compiler and Roslyn
                (<span class="loading-progress-text"></span>)</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">&#x2715;</span>
    </div>
    <script src="js/playground.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
